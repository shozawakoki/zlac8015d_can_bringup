# PID gain identification stage 1: wheels elevated only.
# IMPORTANT: DRY RUN FIRST. This is NOT an authorization to run motors.
# Old bumpless and three-stage startup handoffs explicitly disabled.
schema_version: 1
surface: wheels_elevated
disturbance: none
output_root: ~/ros2_experiments/pid_calibration
wheel_radius_m: 0.064
wheel_separation_m: 0.354
publish_hz: 20
ready_timeout_s: 25
between_trials_s: 5
repeats: 1
safety:
  max_linear_m_s: 0.06
  max_angular_rad_s: 0.10
  max_wheel_rad_s: 1.2
  max_current_a: 2.0
defaults:
  pid_kp: 0.4
  pid_ki: 0.2
  pid_kd: 0.0
  pid_derivative_filter_tau_s: 0.05
  pid_bumpless_handoff: 0
  pid_three_stage_transition: 0
  pid_transition_duration_s: 0.10
  current_limit_a: 2.0
  current_rate_limit_a_per_s: 20.0
  feedback_timeout_ms: 30.0
  breakaway_start_a: 0.65
  breakaway_step_a: 0.10
  breakaway_max_a: 2.0
  breakaway_step_samples: 20
  breakaway_start_speed_rad_s: 0.30
  breakaway_start_samples: 6
  stall_speed_rad_s: 0.10
  stall_samples: 80
  stall_min_drive_current_a: 0.20
profiles:
  - name: wheel_005
    stages:
      - {duration_s: 1.0, linear_x: 0.0, angular_z: 0.0}
      - {duration_s: 2.0, linear_x: 0.05, angular_z: 0.0}
      - {duration_s: 3.0, linear_x: 0.0, angular_z: 0.0}
candidates:
  - name: PI_reference
    mode: pid_torque
    profiles: [wheel_005]
    gains: {pid_kd: 0.0}
  - name: PID_D001
    mode: pid_torque
    profiles: [wheel_005]
    gains: {pid_kd: 0.01}
  - name: PID_D002
    mode: pid_torque
    profiles: [wheel_005]
    gains: {pid_kd: 0.02}
