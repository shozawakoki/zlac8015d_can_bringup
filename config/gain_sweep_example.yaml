# Sequential gain tuning trial plan for run_gain_sweep.py.
# Review the planned movement and confirmed E-stop before --execute.
# Safety policy: starts/ends stopped; the runner never accepts >0.20 m/s,
# >0.40 rad/s, >10 rad/s wheel speed or >8 A configured current.
schema_version: 1
output_root: ~/ros2_experiments
surface: flat_indoor
disturbance: none
repeats: 1
publish_hz: 20
ready_timeout_s: 25
between_trials_s: 4
wheel_radius_m: 0.064
wheel_separation_m: 0.354

safety:
  max_linear_m_s: 0.20
  max_angular_rad_s: 0.40
  max_wheel_rad_s: 10.0
  max_current_a: 4.0

defaults:
  pid_kp: 0.7
  pid_ki: 0.5
  pid_kd: 0.03
  pid_derivative_filter_tau_s: 0.05
  ladrc_b0_left: 18.0
  ladrc_b0_right: 18.0
  ladrc_wc: 5.0
  ladrc_wo: 20.0
  current_limit_a: 4.0
  current_rate_limit_a_per_s: 20.0
  feedback_timeout_ms: 30.0

profiles:
  # Duration includes command holding time, not a displacement guarantee.
  # Starting and ending at zero speed is mandatory.
  - name: straight_010
    stages:
      - {duration_s: 2.0, linear_x: 0.00, angular_z: 0.00}
      - {duration_s: 4.0, linear_x: 0.10, angular_z: 0.00}
      - {duration_s: 3.0, linear_x: 0.00, angular_z: 0.00}

# Each candidate is one hardware startup per selected profile/repetition.
# P -> PI -> PID and LADRC bandwidth candidates are deliberately conservative.
# Each parameter value is applied to the in-memory robot_description at launch.
# If any test fails readiness, overspeed, feedback or stop checks, the sweep stops.
candidates:
  - name: drive_baseline
    mode: velocity
    profiles: [straight_010]

  - name: pid_p02
    mode: pid_torque
    gains: {pid_kp: 0.2, pid_ki: 0.0, pid_kd: 0.0}
    profiles: [straight_010]

  - name: pid_p04
    mode: pid_torque
    gains: {pid_kp: 0.4, pid_ki: 0.0, pid_kd: 0.0}
    profiles: [straight_010]

  - name: pid_p07
    mode: pid_torque
    gains: {pid_kp: 0.7, pid_ki: 0.0, pid_kd: 0.0}
    profiles: [straight_010]

  - name: pid_pi_01
    mode: pid_torque
    gains: {pid_kp: 0.7, pid_ki: 0.1, pid_kd: 0.0}
    profiles: [straight_010]

  - name: pid_pi_03
    mode: pid_torque
    gains: {pid_kp: 0.7, pid_ki: 0.3, pid_kd: 0.0}
    profiles: [straight_010]

  - name: pid_070503
    mode: pid_torque
    gains: {pid_kp: 0.7, pid_ki: 0.5, pid_kd: 0.03}
    profiles: [straight_010]

  - name: adrc_wc2_wo8
    mode: ladrc_torque
    gains: {ladrc_wc: 2.0, ladrc_wo: 8.0}
    profiles: [straight_010]

  - name: adrc_wc3_wo12
    mode: ladrc_torque
    gains: {ladrc_wc: 3.0, ladrc_wo: 12.0}
    profiles: [straight_010]

  - name: adrc_wc5_wo20
    mode: ladrc_torque
    gains: {ladrc_wc: 5.0, ladrc_wo: 20.0}
    profiles: [straight_010]
